name: Automated Daily Beta Calculation

on:
  schedule:
    # 4:00 PM IST = 10:30 AM UTC (Mon - Fri)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  calculate-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Beta Calculation Engine
        run: |
          python src/beta_calculator.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_beta.csv data/beta_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Beta metrics: $(date +'%Y-%m-%d')" && git push)
